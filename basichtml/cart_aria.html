<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Checkout Page</title>
    </head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt='A three by three rubix cube.'>
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for='card-name'>Cardholder Name
                <span aria-hidden='true'>*</span></label>
            <input type="text" 
            id="card-name" 
            name='card-name'
            required>
        

            <label for="card-number">Card Number
                <span aria-hidden="true">*</span></label>
            <input type="text" 
            name="card-number" 
            id="card-number"
            aria-describedby="card-number-help"
            required>
            <p id='card-number-help'>1234-5678</p>
        </form>
    </section> 
</body>
</html>
