<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
<h1>Multimedia (Video & Audio)</h1>

<section>
  <h2>Some Demonic Music From the Underworld</h2>
  <audio 
  controls 
  aria-label="Audio playback, and volumn control.">
  <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="/mp3"></audio>
</section>

<section>
  <h2>Map Method</h2>
  <video 
  controls
  width="300"
  aria-label="Video playback, and volume control">
  <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="/mp4">

  <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" 
  kind="captions" 
  srclang="en"
  label="english">
  </video>
</section>

<section>
  <h2>Transcript</h2>
  <p>xd</p>
</section>
</body>

</html>
